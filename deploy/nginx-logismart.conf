server {
    server_name logistica.promube.com;

    access_log /var/log/nginx/logismart_access.log;
    error_log /var/log/nginx/logismart_error.log;
    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Entrypoints estables: revalidar en cada carga para evitar mezclar builds.
    location = /static/frontend/assets/app.css {
        alias /var/www/logismart/static/frontend/assets/app.css;
        access_log off;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /static/frontend/assets/app.js {
        alias /var/www/logismart/static/frontend/assets/app.js;
        access_log off;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /static/ {
        alias /var/www/logismart/static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8008;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/logistica.promube.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logistica.promube.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name logistica.promube.com;
    return 301 https://$host$request_uri;
}
