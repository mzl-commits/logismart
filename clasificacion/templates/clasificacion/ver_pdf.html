<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsualizar Guía PDF</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            width: 100%;
            padding: 16px 24px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .title {
            font-size: 16px;
            font-weight: 700;
        }
        .btn-download {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            transition: background-color 0.2s;
        }
        .btn-download:hover {
            background-color: #0369a1;
        }
        .pdf-container {
            width: 100%;
            max-width: 800px;
            padding: 24px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        canvas {
            width: 100%;
            height: auto;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.3), 0 4px 6px -4px rgb(0 0 0 / 0.3);
        }
        .loading {
            padding: 80px 20px;
            text-align: center;
            color: #94a3b8;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="header">
        <span class="title">Previsualización de Guía</span>
        <a class="btn-download" href="{{ download_url }}">Descargar Guía</a>
    </div>
    <div class="loading" id="loading">Cargando previsualizador de PDF...</div>
    <div class="pdf-container" id="pdf-container"></div>

    <script>
        const url = '{{ pdf_url }}';
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        const loadingEl = document.getElementById('loading');
        const container = document.getElementById('pdf-container');

        // Ocultar cabecera si está embebido (ej. en la app móvil)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('embed') === 'true' || urlParams.get('mobile') === 'true') {
            const headerEl = document.querySelector('.header');
            if (headerEl) {
                headerEl.style.display = 'none';
            }
        }

        pdfjsLib.getDocument(url).promise.then(pdf => {
            loadingEl.style.display = 'none';
            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                pdf.getPage(pageNum).then(page => {
                    const viewport = page.getViewport({ scale: 2.0 });
                    
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    
                    container.appendChild(canvas);
                    
                    const renderContext = {
                        canvasContext: context,
                        viewport: viewport
                    };
                    page.render(renderContext);
                });
            }
        }).catch(err => {
            loadingEl.textContent = 'Error al cargar el PDF: ' + err.message;
            console.error(err);
        });
    </script>
</body>
</html>
