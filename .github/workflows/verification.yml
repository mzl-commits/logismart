name: Verification

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test
        env:
          DJANGO_DEBUG: 'True'
          DJANGO_SECRET_KEY: ci-only-secret
          EXTERNAL_API_KEY: ci-only-api-key
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logismart-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: logismart-frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
